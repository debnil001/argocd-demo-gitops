replicaCount: 2

image:
  repository: my-app
  tag: v2
  pullPolicy: IfNotPresent

app:
  version: dev

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
